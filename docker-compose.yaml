version: '3.8'

services:

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    networks:
      - mongo-network

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == worker

      restart_policy:
        condition: on-failure

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb

    networks:
      - mongo-network

    deploy:
      replicas: 3

      placement:
        constraints:
          - node.role == worker

      restart_policy:
        condition: on-failure

volumes:
  mongo-data:

networks:
  mongo-network:
    driver: overlay
